<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1d4a">
    <title>ISOLA · FOR2D ROYAL</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/isola.css?v=2">
</head>
<body>
    <canvas id="isolaCanvas" aria-label="Île d'ISOLA en 3D"></canvas>

    <!-- Chargement -->
    <div id="isoLoading" class="iso-loading" role="status" aria-live="polite">
        <div class="iso-logo">ISO<span>LA</span></div>
        <p id="isoLoadingText">Chargement…</p>
        <div class="iso-spinner" aria-hidden="true"></div>
    </div>

    <!-- HUD -->
    <div class="iso-hud">
        <div class="iso-top-left">
            <a class="iso-back" href="index.html" aria-label="Retour au lobby">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
                Lobby
            </a>
            <div class="iso-badge">ISOLA <span>prototype</span></div>
        </div>

        <div id="isoLocation" class="iso-location" aria-live="polite">
            <span class="iso-loc-name">—</span>
            <span class="iso-loc-sub"></span>
        </div>

        <canvas id="isoMinimap" class="iso-minimap" width="200" height="200" aria-label="Minimap"></canvas>

        <div id="isoBush" class="iso-bush" hidden>🌿 Caché dans le buisson</div>
        <div id="isoPrompt" class="iso-prompt" hidden></div>
        <div id="isoToast" class="iso-toast" role="status" aria-live="polite" hidden></div>

        <!-- Barre du bas : soins, vie/bouclier, armes -->
        <div id="isoBottom" class="iso-bottom" hidden>
            <div class="iso-heals" role="group" aria-label="Soins">
                <button type="button" class="iso-heal" data-heal="bandage">
                    <img alt="" draggable="false"><span class="iso-heal-count">0</span><span class="iso-heal-name">Bandage</span><kbd>3</kbd>
                </button>
                <button type="button" class="iso-heal" data-heal="shieldPotion">
                    <img alt="" draggable="false"><span class="iso-heal-count">0</span><span class="iso-heal-name">Potion</span><kbd>4</kbd>
                </button>
                <button type="button" class="iso-heal" data-heal="medkit">
                    <img alt="" draggable="false"><span class="iso-heal-count">0</span><span class="iso-heal-name">Kit</span><kbd>5</kbd>
                </button>
            </div>

            <div class="iso-vitals">
                <div id="isoCast" class="iso-cast" hidden>
                    <span id="isoCastLabel" class="iso-cast-label"></span>
                    <span class="iso-cast-bar"><i id="isoCastFill"></i></span>
                </div>
                <div class="iso-bar shield" role="img" aria-label="Bouclier"><i id="isoShieldFill"></i><span id="isoShieldText">0</span></div>
                <div class="iso-bar health" role="img" aria-label="Vie"><i id="isoHealthFill"></i><span id="isoHealthText">100</span></div>
            </div>

            <div class="iso-weapons" role="group" aria-label="Armes">
                <button type="button" class="iso-wcard empty" data-slot="0">
                    <kbd>1</kbd><img alt="" draggable="false" hidden><span class="iso-wname">Vide</span><span class="iso-wammo"></span>
                </button>
                <button type="button" class="iso-wcard empty" data-slot="1">
                    <kbd>2</kbd><img alt="" draggable="false" hidden><span class="iso-wname">Vide</span><span class="iso-wammo"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Chiffres de dégâts et barres au-dessus des têtes (positionnés en JS) -->
    <div id="isoFloat" class="iso-float" aria-hidden="true"></div>

    <script type="module" src="js/isola/main.js?v=2"></script>
</body>
</html>
